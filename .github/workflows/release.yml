name: Release
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description:
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Plugins
        run: |
          mkdir -p dist
          (cd plugins/blender && zip -r "$GITHUB_WORKSPACE/dist/ueformat-blender.zip" io_scene_ueformat)
          (cd plugins/unreal && zip -r "$GITHUB_WORKSPACE/dist/ueformat-unreal.zip" UEFormat)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: UEFormat ${{ steps.vars.outputs.tag }}
          files: |
            dist/ueformat-blender.zip
            dist/ueformat-unreal.zip
          fail_on_unmatched_files: true
